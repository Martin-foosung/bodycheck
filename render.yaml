services:
  - type: web
    name: bodycheck-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bodycheck-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: HIRA_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
databases:
  - name: bodycheck-db
    plan: free
